[package]
name = "kayo-compiler"
version = "0.0.1"
edition = "2021"
description = "KAYO\\n, the CyborgPL compiler: the base, its lowest level, and Precog (kayo/LIMBS.md)"
publish = false

[lib]
name = "kayo"
path = "src/lib.rs"

# The command is `kayo` alone (owner, 2026-10-16); the old names, `cca`,
# `synapse`, `syn`, `sng`, `suc` and `zomp`, are refused naming it (src/bin/).
[[bin]]
name = "kayo"
path = "src/main.rs"

[dependencies]
# The base: the power ledger (LIMBS.md, step 2).
kayo-base = { path = "../base" }
# LLVM as one shared library, the one lld's libraries use too (owner,
# 2026-10-08: lld built into CCA): one LLVM in the process, never two.
inkwell = { version = "0.10", features = ["llvm22-1-force-dynamic"] }
# The C API, for what inkwell cannot say: loop metadata naming itself.
llvm-sys = { version = "221.1", features = ["force-dynamic"] }
# The same pinned crate as the runtime's, so `cca version` names the Unicode
# version every binary's grapheme clusters follow.
unicode-segmentation = { version = "=1.13.3", default-features = false }

[build-dependencies]
# lld's C++ entry point, behind a small C shim (`lld/shim.cpp`).
cc = "1"
