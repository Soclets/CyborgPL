# LLVM lives where Homebrew puts it on this machine. `design/tooling.md`
# says the *target* is a description in Synthia.cplm and never sniffed from
# the host; this is not that — it is where the compiler's own dependency
# is installed, the way Kespar's config points at Z3. It moves into
# Synthia's own build setup when Synthia exists.
#
# The version follows inkwell (design/implementation-languages.md): inkwell
# 0.10 builds against LLVM 22.1, and LLVM 23 is installed here too but
# inkwell 0.10 has no feature for it.
[env]
LLVM_SYS_221_PREFIX = "/opt/homebrew/opt/llvm@22"
# lld, built into CCA through its library (owner, 2026-10-08: "`a`", Zig's
# way): Homebrew's lld 22, matching the LLVM above, for now.
KAYO_LLD_PREFIX = "/opt/homebrew/opt/lld@22"
# The share below holds for the tests cargo runs side by side, too.
RUST_TEST_THREADS = "3"

# This session's share of the machine (owner, 2026-09-23): 10 cores, three
# sessions doing heavy work, 3 each and one left for the desktop. The test
# suite keeps to the same number (`compiler/tests/common`, KAYO_TEST_JOBS).
[build]
jobs = 3
