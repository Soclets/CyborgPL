[package]
name = "kayo-metal-bench"
version = "0.0.1"
edition = "2021"
description = "Point 3 (owner, 2026-10-25: \"let it measure\"): an inline.MSL binding copied against lent with no copy, on this Mac's GPU"
publish = false

[[bin]]
name = "kayo-metal-bench"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
# `MTLAllocation` and `block2` for newBufferWithBytesNoCopy, beside what kayo-metal takes.
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "dispatch2", "block2", "MTLAllocation", "MTLDevice", "MTLBuffer", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLLibrary", "MTLResource", "MTLTypes"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["alloc", "block2", "objc2"] }
