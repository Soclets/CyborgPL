[workspace]
resolver = "2"
members = ["base", "compiler", "runtime", "metal", "limbs/*"]
# kayo-metal turns on the runtime's `std`: built with the rest, it would
# make every program's runtime std's too, so it is built only by name,
# `cargo build -p kayo-metal --release`.
default-members = ["base", "compiler", "runtime", "limbs/*"]

[profile.release]
panic = "abort"
opt-level = 3
debug = 1

[profile.dev]
panic = "abort"
# Optimised in development too (owner: optimised everywhere, the tooling
# too): the test suite runs Precog over every program, and at opt-level 0
# that was the slowest part of the day. Overflow checks and debug
# assertions stay on — they are what catches Precog's own arithmetic.
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
