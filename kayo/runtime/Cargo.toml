[package]
name = "kayo-runtime"
version = "0.0.1"
edition = "2021"
description = "The runtime, no_std, linked into every CyborgPL program"
publish = false

[lib]
name = "kayo_runtime"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]
test = false
doctest = false
bench = false

[dependencies]
# UAX #29 grapheme clusters (`char.grapheme`, counts in graphemes): no_std,
# and the one table a text runtime cannot do without.
unicode-segmentation = { version = "=1.13.3", default-features = false }

