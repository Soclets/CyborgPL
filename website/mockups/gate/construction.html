<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under construction · CyborgPL</title>
<meta name="color-scheme" content="dark">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; background: #002b36; color: #93a1a1; }  /* Solarized Dark */
  main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 96px 24px; position: relative; overflow: hidden; }
  /* One 72px square tile that repeats seamlessly in every direction (45° stripes, two per tile).
     Sliding it exactly one tile loops with no join anywhere along the band. */
  .band { position: absolute; left: 0; right: 0; height: 46px;
          background-image: linear-gradient(-45deg, #6c71c4 25%, #002b36 25% 50%, #6c71c4 50% 75%, #002b36 75%);
          background-size: 72px 72px; }
  .band { --run: 72px; }
  .band.top { top: 0; animation: slide-right 2.4s linear infinite; }
  .band.bot { bottom: 0; animation: slide-left 2.4s linear infinite; }
  @keyframes slide-right { from { background-position: 0 0; } to { background-position: var(--run) 0; } }
  @keyframes slide-left  { from { background-position: 0 0; } to { background-position: calc(-1 * var(--run)) 0; } }
  @media (prefers-reduced-motion: reduce) { .band.top, .band.bot { animation: none; } }
  .inner { text-align: center; max-width: 720px; }
  .inner svg { display: block; margin: 0 auto 26px; }
  h1 { font-size: clamp(40px, 8vw, 84px); line-height: .95; margin: 0 0 20px; letter-spacing: -.03em; font-weight: 900; text-transform: uppercase; color: #eee8d5; }
  h1 span { color: #6c71c4; }
  p { font-size: 18px; color: #839496; line-height: 1.55; margin: 0 auto 30px; max-width: 520px; }
  a.btn { display: inline-flex; align-items: center; height: 46px; padding: 0 24px; border-radius: 10px; font-weight: 700; font-size: 15px; text-decoration: none; background: #eee8d5; color: #002b36; border: 2px solid #eee8d5; }
  a.btn:hover { background: transparent; color: #eee8d5; }
  a.btn:focus-visible { outline: 2px solid #6c71c4; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="band top" aria-hidden="true"></div>
  <div class="inner">
    <svg viewBox="0 0 32 32" width="64" height="64" aria-hidden="true"><rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="#000000" stroke="#ffffff" stroke-width="1.5"/><g transform="translate(16 16) scale(0.78) translate(-16 -16)"><g transform="translate(1.3 0)"><path d="M22.88 6.17 A12 12 0 1 0 22.88 25.83" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/><circle cx="12.15" cy="13.34" r="1.54" fill="#ffffff"/><circle cx="12.15" cy="18.66" r="1.54" fill="#ffffff"/><rect x="14.95" y="12.29" width="5.95" height="2.1" rx="0.56" fill="#ffffff"/><rect x="14.95" y="17.61" width="5.95" height="2.1" rx="0.56" fill="#ffffff"/></g></g></svg>
    <h1>Under <span>construction</span></h1>
    <p>CyborgPL is in development. The language, its syntax, and this site change without notice.</p>
    <a class="btn" href="../app/dist/index.html">Enter anyway</a>
  </div>
  <div class="band bot" aria-hidden="true"></div>
</main>
</body>
</html>
