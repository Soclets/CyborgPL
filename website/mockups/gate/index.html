<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyborgPL</title>
<meta name="color-scheme" content="dark">
<style>
  :root { --green: #859900; --dim: #586e75; --bg: #002b36; }  /* Solarized Dark: base03, green, base01 */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    color: var(--green);
    font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    text-shadow: 0 0 6px rgba(133, 153, 0, 0.35);
    -webkit-font-smoothing: antialiased;
    cursor: text;
  }
  main { max-width: 820px; padding: 28px 24px 40px; }
  pre, p { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .dim { color: var(--dim); }
  .gap { height: 1.6em; }
  .row { display: flex; gap: 0.6ch; align-items: baseline; }
  .prompt { flex: none; }
  input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0; padding: 0; margin: 0;
    color: var(--green); caret-color: var(--green);
    font: inherit; text-shadow: inherit;
  }
  noscript a { color: var(--green); }
  @media (prefers-reduced-motion: reduce) { body { text-shadow: none; } }
</style>
</head>
<body>
<main>
  <pre>CyborgPL — website

CyborgPL is in development. The language, its syntax, and this site
still change without notice. Nothing here is a stable release.</pre>
  <div class="gap"></div>
  <p>Type <b>proceed</b> and press Enter to continue.</p>
  <div class="gap"></div>
  <div id="log" aria-live="polite"></div>
  <form class="row" id="cli" autocomplete="off">
    <label class="prompt" for="cmd">$</label>
    <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus aria-label="Command">
  </form>
  <noscript><p><br>This prompt needs JavaScript. <a href="construction.html">Continue without it</a>.</p></noscript>
</main>
<script>
  const NEXT = 'construction.html';          // the Under Construction page
  const log = document.getElementById('log');
  const form = document.getElementById('cli');
  const input = document.getElementById('cmd');

  const line = (text, cls) => {
    const p = document.createElement('p');
    p.textContent = text;
    if (cls) p.className = cls;
    log.appendChild(p);
  };

  // Any click or tap puts the cursor back in the prompt (and raises the phone keyboard).
  document.addEventListener('click', () => input.focus());

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = input.value;
    const cmd = raw.trim().toLowerCase();
    line('$ ' + raw);
    input.value = '';

    if (cmd === 'proceed') {
      line('proceeding…');
      input.disabled = true;
      setTimeout(() => location.assign(NEXT), 450);
      return;
    }
    if (cmd === '') return;
    if (cmd === 'help') {
      line('the only command here is: proceed', 'dim');
      return;
    }
    // Wrong input answers in CyborgPL's own diagnostic shape (design/diagnostics.md).
    line('error: `' + raw.trim() + '` is not a command here');
    line('try:   proceed', 'dim');
    line('');
  });
</script>
</body>
</html>
