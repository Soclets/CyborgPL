[package]
name = "cca"
version = "0.0.1"
edition = "2021"
description = "Cyborg Chassis Assembler — the CyborgPL compiler"
publish = false

[lib]
name = "cca"
path = "src/lib.rs"

[[bin]]
name = "cca"
path = "src/main.rs"

[dependencies]
inkwell = { version = "0.10", features = ["llvm22-1"] }
# The same pinned crate as the runtime's, so `cca version` names the Unicode
# version every binary's grapheme clusters follow.
unicode-segmentation = { version = "=1.13.3", default-features = false }
