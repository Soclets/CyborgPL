[package]
name = "signatar"
version = "0.0.1"
edition = "2021"
description = "Signatar, the official codextra: the CyborgPL language, built into CCA (cca/PLUGINS.md)"
publish = false

[lib]
name = "signatar"
path = "src/lib.rs"

[[bin]]
name = "cca"
path = "src/main.rs"

[dependencies]
inkwell = { version = "0.10", features = ["llvm22-1"] }
# The C API, for what inkwell cannot say: loop metadata naming itself.
llvm-sys = "221.1"
# The same pinned crate as the runtime's, so `cca version` names the Unicode
# version every binary's grapheme clusters follow.
unicode-segmentation = { version = "=1.13.3", default-features = false }
